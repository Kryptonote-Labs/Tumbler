name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-xml-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate fixtures
        run: bun run compatibility:fixtures -- "$RUNNER_TEMP/tumbler-fixtures"

      - name: Generate presentation fixtures
        run: bun run compatibility:presentations -- "$RUNNER_TEMP/tumbler-presentations" --with-edits

      - name: Validate presentations with Open XML SDK
        run: bun run compatibility:openxml -- "$RUNNER_TEMP/tumbler-presentations"/*.pptx

      - name: Validate with Open XML SDK
        run: bun run compatibility:openxml -- "$RUNNER_TEMP/tumbler-fixtures"/*.xlsx

  libreoffice:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install LibreOffice Calc
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-calc python3-uno

      - name: Generate fixtures
        run: bun run compatibility:fixtures -- "$RUNNER_TEMP/tumbler-input"

      - name: Round-trip with LibreOffice
        run: bun run compatibility:libreoffice -- "$RUNNER_TEMP/tumbler-input" "$RUNNER_TEMP/tumbler-output"

      - name: Retain LibreOffice outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: libreoffice-roundtrip
          path: ${{ runner.temp }}/tumbler-output

  word-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.425
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check compatibility tooling
        run: bun run compatibility:word:check
      - name: Test scoring and DOCX scenarios
        run: bun test tools/word-compatibility/test
      - name: Verify versioned scope against PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun tools/word-compatibility/check-scope.ts "$BASE_SHA"
      - name: Install independent Word document consumer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-writer
      - name: Qualify Word evidence
        env:
          LANG: C.UTF-8
          TZ: UTC
        run: bun run compatibility:word -- --output "$RUNNER_TEMP/word-qualification" --require-openxml --require-libreoffice
      - name: Publish honest qualification summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/word-qualification/report.md" ]]; then
            cat "$RUNNER_TEMP/word-qualification/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain reports, fixtures and oracle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: word-qualification
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/word-qualification/report.*
            ${{ runner.temp }}/word-qualification/**/*.docx
            ${{ runner.temp }}/word-qualification/**/*.log
