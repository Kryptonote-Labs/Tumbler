name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Install Chromium for browser regression tests
        working-directory: apps/docs
        run: bunx --no-install playwright install --with-deps --only-shell chromium

      - name: Test
        run: bun test

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install independent PDF merge oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-dejavu-core
          python3 -m pip install -r tools/pdf-merge/requirements.txt

      - name: Verify merged PDFs with independent readers and rendering
        run: python3 tools/pdf-merge/verify.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check docs
        run: bun run docs:check
      - name: Build docs
        run: bun run docs:build
      - name: Install Chrome for H.264 playback
        working-directory: apps/docs
        run: bunx playwright install --with-deps chrome
      - name: Test playground in Chrome
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: bun run docs:test
